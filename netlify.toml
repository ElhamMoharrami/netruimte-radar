# ==============================================================================
# Netlify deployment configuration for Netruimte Radar.
#
# Frontend: React SPA built with Vite → served from apps/web/dist
# Backend:  Hono API exposed via a single Netlify Function that reuses the
#           existing app.ts + context.ts unchanged.
#
# All server-side environment variables (SERVICE_TOKEN, APIFY_TOKEN,
# *_API_KEY, N8N_WEBHOOK_TOKEN, NOTIFICATION_ALLOWLIST, DEMO_MODE, …) MUST
# be set on the Netlify site (Site configuration → Environment variables).
# Nothing here is exposed to the frontend bundle.
# ==============================================================================

[build]
  # Netlify's build image ships pnpm and resolves it from the root
  # package.json's `packageManager` field — no `corepack enable` needed
  # (the previous prefix hit "Cannot find module .../corepack/.../pnpm.cjs"
  # because corepack couldn't download the pinned pnpm on Netlify).
  # `--frozen-lockfile` keeps CI builds reproducible.
  # `pnpm build` compiles packages/* then apps/* (apps/web produces the
  # static bundle that Netlify serves).
  command   = "pnpm install --frozen-lockfile && pnpm build"
  publish   = "apps/web/dist"
  functions = "netlify/functions"

[build.environment]
  # Matches .nvmrc. Node 24 ships stable `node:sqlite` and native fetch.
  NODE_VERSION = "24"

[functions]
  # esbuild bundles workspace imports (apps/api/src/*, packages/core/*,
  # packages/shared/*) into the function output.
  node_bundler = "esbuild"
  # Ship the AI SDKs as external deps so the bundle stays small; they're
  # only loaded when a matching AI_PROVIDER is set.
  external_node_modules = [
    "@anthropic-ai/sdk",
    "openai",
    "@google/generative-ai",
  ]

# ─── Routing ─────────────────────────────────────────────────────────────────
# The Netlify Function itself declares `config.path = '/api/*'` (see
# `netlify/functions/api.mts`), so Netlify routes every /api/* request to
# the function BEFORE checking the redirects below. That means the SPA
# catch-all cannot swallow API traffic.
#
# The catch-all below serves index.html for every OTHER path so React
# Router routes (/radar, /opportunities/:id, /runs, /demo) work on hard
# refresh instead of 404-ing.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
